[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
aho-corasick = "1.1.4"

[[bench]]
name = "bench_proof"
harness = false

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_ol"
harness = false
