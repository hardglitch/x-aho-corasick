[package]
name = "x-aho-corasick"
version = "0.4.5"
edition = "2024"
authors = ["hardglitch"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
#indexing_slicing = "warn"
